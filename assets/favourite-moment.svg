<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A1C30"/>
      <stop offset="35%" stop-color="#8C3A5A"/>
      <stop offset="70%" stop-color="#DE8CA4"/>
      <stop offset="100%" stop-color="#FCD5CE"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#FFFDF9" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#FFDEB4" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#F5C8D8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F5C8D8" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="600" height="600" fill="url(#skyGrad)"/>

  <!-- Twinkling Stars -->
  <g fill="#FFFFFF" opacity="0.75">
    <circle cx="90" cy="80" r="1.5"/>
    <circle cx="160" cy="50" r="2"/>
    <circle cx="280" cy="90" r="1"/>
    <circle cx="420" cy="65" r="2.5"/>
    <circle cx="510" cy="110" r="1.5"/>
    <circle cx="340" cy="140" r="1.2"/>
    <circle cx="120" cy="170" r="1.8"/>
    <circle cx="480" cy="180" r="1.5"/>
  </g>

  <!-- Giant Glowing Sun -->
  <circle cx="300" cy="360" r="140" fill="url(#sunGlow)"/>

  <!-- Mountain Silhouettes -->
  <path d="M0 450 Q 150 380 300 420 T 600 410 L 600 600 L 0 600 Z" fill="#6A2E47" opacity="0.6"/>
  <path d="M0 480 Q 200 420 400 460 T 600 450 L 600 600 L 0 600 Z" fill="#4B1B30" opacity="0.85"/>
  <path d="M0 520 Q 300 480 600 510 L 600 600 L 0 600 Z" fill="#2E0E1D"/>

  <!-- Golden Sunset Hill with Tree -->
  <ellipse cx="300" cy="560" rx="220" ry="60" fill="#240A16"/>
  
  <!-- Romantic Couple Silhouette -->
  <g fill="#1A0510" transform="translate(255, 430)">
    <!-- Boy -->
    <circle cx="30" cy="20" r="11"/>
    <path d="M18 31 C 18 28, 42 28, 42 31 L 46 80 L 14 80 Z"/>
    <!-- Girl leaning head on shoulder -->
    <circle cx="54" cy="24" r="10"/>
    <path d="M44 34 C 44 30, 66 30, 66 35 L 72 82 C 60 84, 50 84, 40 82 Z"/>
    <!-- Intertwined arms / holding hands -->
    <path d="M38 48 Q 45 60 50 65" stroke="#1A0510" stroke-width="4" fill="none"/>
  </g>

  <!-- Floating Hearts around Couple -->
  <g fill="#FF8BA7" filter="url(#softGlow)" opacity="0.9">
    <path d="M 300 410 C 300 405 292 400 286 406 C 280 412 286 418 300 426 C 314 418 320 412 314 406 C 308 400 300 405 300 410 Z" transform="scale(0.8) translate(80, 80)"/>
    <path d="M 300 410 C 300 405 292 400 286 406 C 280 412 286 418 300 426 C 314 418 320 412 314 406 C 308 400 300 405 300 410 Z" transform="scale(0.55) translate(220, 260)"/>
  </g>

  <!-- Sparkles -->
  <g fill="#FFFDF0" opacity="0.8">
    <path d="M 230 350 Q 230 360 220 360 Q 230 360 230 370 Q 230 360 240 360 Q 230 360 230 350 Z"/>
    <path d="M 370 330 Q 370 340 360 340 Q 370 340 370 350 Q 370 340 380 340 Q 370 340 370 330 Z"/>
  </g>
</svg>

