<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="futureSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A1728"/>
      <stop offset="40%" stop-color="#7B3250"/>
      <stop offset="75%" stop-color="#D98A9F"/>
      <stop offset="100%" stop-color="#FFF0F5"/>
    </linearGradient>
    <radialGradient id="ringShine" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="40%" stop-color="#FFE8B2" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#EAA9BF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6D2947" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="50%" stop-color="#E6AF68"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#futureSky)"/>

  <!-- Starry Constellations -->
  <g fill="#FFF" opacity="0.8">
    <circle cx="100" cy="90" r="1.5"/>
    <circle cx="140" cy="70" r="2.5"/>
    <circle cx="180" cy="110" r="1.5"/>
    <circle cx="430" cy="80" r="2"/>
    <circle cx="490" cy="110" r="1.5"/>
    <circle cx="520" cy="65" r="2.5"/>
    <circle cx="280" cy="60" r="1.5"/>
    <circle cx="340" cy="85" r="1.8"/>
  </g>

  <!-- Glowing Sun / Starburst of May 2027 -->
  <circle cx="300" cy="270" r="150" fill="url(#ringShine)"/>

  <!-- Interlocking Wedding Rings floating in the sky -->
  <g transform="translate(300, 240)">
    <!-- Ring 1 (Gold Band) -->
    <ellipse cx="-35" cy="0" rx="60" ry="60" fill="none" stroke="url(#goldGrad)" stroke-width="12"/>
    <!-- Ring 2 (Rose Gold Band with Diamond) -->
    <ellipse cx="35" cy="0" rx="60" ry="60" fill="none" stroke="#C58A91" stroke-width="12"/>
    <!-- Diamond on Ring 2 -->
    <g transform="translate(75, -50)">
      <polygon points="0,-18 16,-6 10,14 -10,14 -16,-6" fill="#FFF" stroke="#EAA9BF" stroke-width="2"/>
      <polygon points="0,-18 8,-6 0,14 -8,-6" fill="#F0F8FF" opacity="0.8"/>
      <!-- Sparkle -->
      <path d="M 0 -35 Q 0 -18 -15 -18 Q 0 -18 0 0 Q 0 -18 15 -18 Q 0 -18 0 -35 Z" fill="#FFF"/>
    </g>
    <!-- Interlocking overlap effect -->
    <path d="M 12 -28 A 60 60 0 0 1 25 0" stroke="url(#goldGrad)" stroke-width="12" fill="none"/>
  </g>

  <!-- Rolling Meadow below -->
  <path d="M 0 420 Q 200 370 400 400 T 600 380 L 600 600 L 0 600 Z" fill="#7A304D" opacity="0.6"/>
  <path d="M 0 460 Q 300 420 600 450 L 600 600 L 0 600 Z" fill="#5A1E35"/>

  <!-- White Floral Petals along the grass -->
  <g fill="#FFF9F7" opacity="0.8">
    <ellipse cx="120" cy="490" rx="8" ry="4" transform="rotate(-15, 120, 490)"/>
    <ellipse cx="180" cy="515" rx="7" ry="5" transform="rotate(20, 180, 515)"/>
    <ellipse cx="250" cy="485" rx="9" ry="4" transform="rotate(-30, 250, 485)"/>
    <ellipse cx="380" cy="505" rx="8" ry="4" transform="rotate(10, 380, 505)"/>
    <ellipse cx="460" cy="495" rx="7" ry="5" transform="rotate(-25, 460, 495)"/>
  </g>

  <!-- May 2027 Banner -->
  <g transform="translate(200, 520)">
    <rect x="0" y="0" width="200" height="42" rx="21" fill="#FFFFFF" opacity="0.95" stroke="#C58A91" stroke-width="2"/>
    <text x="100" y="27" text-anchor="middle" font-family="'Playfair Display', serif" font-weight="700" font-size="16" fill="#6D2947" letter-spacing="2">
      MAY 2027 💍
    </text>
  </g>
</svg>

