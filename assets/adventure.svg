<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="advSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE4EC"/>
      <stop offset="45%" stop-color="#F8BBD0"/>
      <stop offset="85%" stop-color="#D7CCC8"/>
      <stop offset="100%" stop-color="#A1887F"/>
    </linearGradient>
    <linearGradient id="balloonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5C8D8"/>
      <stop offset="50%" stop-color="#EAA9BF"/>
      <stop offset="100%" stop-color="#C58A91"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#advSky)"/>

  <!-- Fluffy Clouds -->
  <g fill="#FFFFFF" opacity="0.65">
    <ellipse cx="140" cy="180" rx="90" ry="40"/>
    <ellipse cx="180" cy="160" rx="60" ry="35"/>
    <ellipse cx="100" cy="190" rx="50" ry="25"/>

    <ellipse cx="460" cy="240" rx="100" ry="45"/>
    <ellipse cx="500" cy="220" rx="70" ry="40"/>
    <ellipse cx="410" cy="250" rx="60" ry="30"/>
  </g>

  <!-- Hot Air Balloon -->
  <g transform="translate(260, 90)">
    <!-- Balloon Body -->
    <path d="M 40 0 C 95 0, 105 75, 65 125 L 50 145 L 30 145 L 15 125 C -25 75, -15 0, 40 0 Z" fill="url(#balloonGrad)"/>
    <!-- Stripes -->
    <path d="M 40 0 C 65 0, 75 75, 45 145 L 35 145 C 5 75, 15 0, 40 0 Z" fill="#FFF0F5" opacity="0.45"/>
    <!-- Heart on balloon -->
    <path d="M 40 50 C 40 45, 34 40, 30 45 C 25 50, 30 55, 40 62 C 50 55, 55 50, 50 45 C 46 40, 40 45, 40 50 Z" fill="#6D2947" transform="scale(1.2) translate(-6, -10)"/>
    <!-- Ropes & Basket -->
    <line x1="28" y1="145" x2="33" y2="165" stroke="#8D6E63" stroke-width="2"/>
    <line x1="52" y1="145" x2="47" y2="165" stroke="#8D6E63" stroke-width="2"/>
    <rect x="31" y="165" width="18" height="15" rx="3" fill="#6D4C41"/>
  </g>

  <!-- Rolling Hills & Winding Road -->
  <path d="M 0 380 Q 200 320 400 350 T 600 330 L 600 600 L 0 600 Z" fill="#8C5368" opacity="0.6"/>
  <path d="M 0 430 Q 300 380 600 420 L 600 600 L 0 600 Z" fill="#6D2947"/>

  <!-- Road for two -->
  <path d="M 280 440 Q 340 500 240 600" stroke="#EAA9BF" stroke-width="32" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 280 440 Q 340 500 240 600" stroke="#FFF" stroke-width="3" stroke-dasharray="10,12" stroke-linecap="round" fill="none"/>

  <!-- Vintage Tandem Bicycle / Couple Exploring -->
  <g transform="translate(240, 490) scale(0.65)" stroke="#FFF" stroke-width="3.5" fill="none">
    <!-- Wheels -->
    <circle cx="20" cy="50" r="20"/>
    <circle cx="100" cy="50" r="20"/>
    <!-- Frame -->
    <path d="M 20 50 L 50 50 L 70 25 L 35 25 Z"/>
    <path d="M 50 50 L 80 50 L 100 50"/>
    <path d="M 60 50 L 70 25"/>
    <line x1="35" y1="25" x2="30" y2="20"/>
    <line x1="70" y1="25" x2="65" y2="20"/>
    <!-- Handlebars -->
    <line x1="25" y1="18" x2="35" y2="18"/>
    <line x1="60" y1="18" x2="70" y2="18"/>
  </g>

  <!-- Little birds in sky -->
  <g stroke="#6D2947" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 120 120 Q 128 112 136 120 Q 144 112 152 120"/>
    <path d="M 155 105 Q 161 99 167 105 Q 173 99 179 105"/>
  </g>
</svg>

