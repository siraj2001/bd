<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="smileBg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFF5F8"/>
      <stop offset="50%" stop-color="#FCE4EC"/>
      <stop offset="100%" stop-color="#F8BBD0"/>
    </radialGradient>
    <linearGradient id="roseGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5C8D8"/>
      <stop offset="50%" stop-color="#C58A91"/>
      <stop offset="100%" stop-color="#6D2947"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#smileBg)"/>

  <!-- Floral Garland Arch -->
  <g stroke="#C58A91" fill="none" stroke-width="2.5" opacity="0.6">
    <path d="M 80 480 C 80 200, 520 200, 520 480"/>
    <path d="M 120 480 C 120 250, 480 250, 480 480" stroke-dasharray="6,6"/>
  </g>

  <!-- Blooming Roses & Peonies around the arch -->
  <g fill="#EAA9BF">
    <circle cx="140" cy="300" r="28" fill="#F5C8D8"/>
    <circle cx="140" cy="300" r="18" fill="#EAA9BF"/>
    <circle cx="140" cy="300" r="10" fill="#C58A91"/>
    
    <circle cx="460" cy="300" r="28" fill="#F5C8D8"/>
    <circle cx="460" cy="300" r="18" fill="#EAA9BF"/>
    <circle cx="460" cy="300" r="10" fill="#C58A91"/>

    <circle cx="300" cy="220" r="32" fill="#F5C8D8"/>
    <circle cx="300" cy="220" r="22" fill="#EAA9BF"/>
    <circle cx="300" cy="220" r="12" fill="#C58A91"/>
  </g>

  <!-- Leaves -->
  <g fill="#A3B18A" opacity="0.8">
    <path d="M 160 280 Q 190 270 175 295 Z"/>
    <path d="M 115 325 Q 95 345 110 350 Z"/>
    <path d="M 440 280 Q 410 270 425 295 Z"/>
    <path d="M 485 325 Q 505 345 490 350 Z"/>
    <path d="M 260 215 Q 240 195 265 190 Z"/>
    <path d="M 340 215 Q 360 195 335 190 Z"/>
  </g>

  <!-- Glowing Heart Core / Radiant Smile Icon -->
  <g transform="translate(300, 360)">
    <!-- Aura -->
    <circle cx="0" cy="0" r="90" fill="#FFFFFF" opacity="0.7"/>
    <!-- Smiling Eyes and Heart -->
    <path d="M -45 -10 Q -25 -25 -5 -10" stroke="#6D2947" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 5 -10 Q 25 -25 45 -10" stroke="#6D2947" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <!-- Happy Smile -->
    <path d="M -35 20 Q 0 55 35 20" stroke="#6D2947" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <!-- Rosy Cheeks -->
    <ellipse cx="-42" cy="18" rx="14" ry="8" fill="#F5C8D8" opacity="0.9"/>
    <ellipse cx="42" cy="18" rx="14" ry="8" fill="#F5C8D8" opacity="0.9"/>
  </g>

  <!-- Shimmering Sparkles -->
  <g fill="#C58A91" opacity="0.75">
    <path d="M 210 260 Q 210 270 200 270 Q 210 270 210 280 Q 210 270 220 270 Q 210 270 210 260 Z"/>
    <path d="M 390 260 Q 390 270 380 270 Q 390 270 390 280 Q 390 270 400 270 Q 390 270 390 260 Z"/>
    <path d="M 300 480 Q 300 490 290 490 Q 300 490 300 500 Q 300 490 310 490 Q 300 490 300 480 Z"/>
  </g>

  <!-- Gentle Text in banner -->
  <text x="300" y="525" text-anchor="middle" font-family="'Playfair Display', serif" font-size="20" font-style="italic" fill="#6D2947">
    Pure Sunshine &amp; Grace
  </text>
</svg>

