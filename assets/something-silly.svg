<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="sillyBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="60%" stop-color="#FCE4EC"/>
      <stop offset="100%" stop-color="#F8BBD0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="600" fill="url(#sillyBg)"/>

  <!-- Fun Playful Confetti & Doodles -->
  <g fill="#C58A91" opacity="0.6">
    <circle cx="90" cy="110" r="8"/>
    <circle cx="490" cy="130" r="10"/>
    <circle cx="120" cy="460" r="6"/>
    <circle cx="500" cy="450" r="9"/>
    <!-- Little stars -->
    <path d="M 160 80 Q 160 90 150 90 Q 160 90 160 100 Q 160 90 170 90 Q 160 90 160 80 Z" fill="#6D2947"/>
    <path d="M 430 90 Q 430 100 420 100 Q 430 100 430 110 Q 430 100 440 100 Q 430 100 430 90 Z" fill="#6D2947"/>
  </g>

  <!-- Two adorable goofy mochi dumplings / bunnies sharing a strawberry & boba -->
  <!-- Left Cute Character (Her) -->
  <g transform="translate(160, 220)">
    <!-- Bunny Ears with bow -->
    <ellipse cx="60" cy="15" rx="16" ry="40" fill="#FFF" stroke="#6D2947" stroke-width="4" transform="rotate(-15, 60, 15)"/>
    <ellipse cx="60" cy="15" rx="9" ry="25" fill="#F5C8D8" transform="rotate(-15, 60, 15)"/>
    <ellipse cx="100" cy="20" rx="16" ry="40" fill="#FFF" stroke="#6D2947" stroke-width="4" transform="rotate(12, 100, 20)"/>
    <ellipse cx="100" cy="20" rx="9" ry="25" fill="#F5C8D8" transform="rotate(12, 100, 20)"/>
    <!-- Cute Bow -->
    <g transform="translate(42, 45) scale(0.8)">
      <polygon points="0,0 20,-10 20,10" fill="#EAA9BF" stroke="#6D2947" stroke-width="3"/>
      <polygon points="40,0 20,-10 20,10" fill="#EAA9BF" stroke="#6D2947" stroke-width="3"/>
      <circle cx="20" cy="0" r="6" fill="#C58A91"/>
    </g>
    <!-- Body -->
    <ellipse cx="80" cy="110" rx="75" ry="65" fill="#FFF" stroke="#6D2947" stroke-width="4"/>
    <!-- Heart sunglasses! -->
    <g transform="translate(40, 80) scale(0.65)" fill="#6D2947">
      <!-- Left heart lens -->
      <path d="M 25 15 C 25 5, 0 5, 0 25 C 0 45, 25 60, 25 60 C 25 60, 50 45, 50 25 C 50 5, 25 5, 25 15 Z"/>
      <!-- Bridge -->
      <rect x="45" y="22" width="30" height="6"/>
      <!-- Right heart lens -->
      <path d="M 95 15 C 95 5, 70 5, 70 25 C 70 45, 95 60, 95 60 C 95 60, 120 45, 120 25 C 120 5, 95 5, 95 15 Z"/>
    </g>
    <!-- Goofy sticking tongue out smile -->
    <path d="M 68 125 Q 80 135 92 125" stroke="#6D2947" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 76 130 C 76 142, 84 142, 84 130 Z" fill="#FF8BA7" stroke="#6D2947" stroke-width="2"/>
    <!-- Rosy cheeks -->
    <circle cx="45" cy="115" r="10" fill="#F5C8D8"/>
    <circle cx="115" cy="115" r="10" fill="#F5C8D8"/>
  </g>

  <!-- Right Cute Character (Him) -->
  <g transform="translate(300, 240)">
    <!-- Little bear ears -->
    <circle cx="50" cy="40" r="22" fill="#EAA9BF" stroke="#6D2947" stroke-width="4"/>
    <circle cx="50" cy="40" r="12" fill="#FFF"/>
    <circle cx="110" cy="40" r="22" fill="#EAA9BF" stroke="#6D2947" stroke-width="4"/>
    <circle cx="110" cy="40" r="12" fill="#FFF"/>
    <!-- Body -->
    <ellipse cx="80" cy="100" rx="72" ry="60" fill="#EAA9BF" stroke="#6D2947" stroke-width="4"/>
    <!-- Happy squinting anime eyes -->
    <path d="M 50 85 Q 60 70 70 85" stroke="#6D2947" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 90 85 Q 100 70 110 85" stroke="#6D2947" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Big grin -->
    <path d="M 65 105 Q 80 130 95 105 Z" fill="#6D2947"/>
    <!-- Cheeks -->
    <circle cx="45" cy="100" r="9" fill="#FFF" opacity="0.6"/>
    <circle cx="115" cy="100" r="9" fill="#FFF" opacity="0.6"/>
  </g>

  <!-- Big Red Strawberry between them -->
  <g transform="translate(275, 340)">
    <path d="M 25 10 C 50 10, 50 45, 25 60 C 0 45, 0 10, 25 10 Z" fill="#E63946"/>
    <!-- Seeds -->
    <circle cx="18" cy="25" r="2" fill="#FFEAA7"/>
    <circle cx="32" cy="25" r="2" fill="#FFEAA7"/>
    <circle cx="25" cy="40" r="2" fill="#FFEAA7"/>
    <!-- Leaves -->
    <path d="M 25 12 Q 10 0 15 12 Q 25 2 25 12 Q 35 2 40 12" fill="#2A9D8F"/>
  </g>

  <!-- Cute speech bubble: "I'm with goofy! ♡" -->
  <g transform="translate(180, 440)">
    <rect x="0" y="0" width="240" height="50" rx="25" fill="#FFF" stroke="#6D2947" stroke-width="3"/>
    <polygon points="120,50 135,62 135,50" fill="#FFF" stroke="#6D2947" stroke-width="3"/>
    <rect x="122" y="47" width="16" height="5" fill="#FFF"/>
    <text x="120" y="32" text-anchor="middle" font-family="'DM Sans', sans-serif" font-weight="700" font-size="16" fill="#6D2947">
      My favourite silly person 🤪❤️
    </text>
  </g>
</svg>

